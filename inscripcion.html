<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preinscripción - Escuela técnica N°1 Los Toldos</title>
    <link rel="stylesheet" href="estilos/base.css">
    <link rel="stylesheet" href="estilos/inscripcion.css">
    <link rel="stylesheet" href="estilos/nav-footer.css">
    <link rel="icon" href="imagenes/Logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="canonical" href="https://www.tecnica1lt.edu.ar/inscripcion.html">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Finlandica+Headline:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Slab:wght@100..900&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet"> 
</head>
<body>
    <div id="site-header"></div>

    <section class="inscripcion-contenedor">
    <h2>Preinscripción Escolar</h2>
    <p>Complete el siguiente formulario para iniciar el proceso de preinscripción.</p>

    <!-- Reemplaza la URL del 'action' con tu endpoint de Formspree -->
    <form id="formInscripcion" method="POST" class="form-preinscripcion">
        
        <div class="form-grupo">
            <label for="nombre">Nombre y Apellido del Alumno:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez">
        </div>

        <div class="form-grupo">
            <label for="dni">DNI del Alumno:</label>
            <input type="number" id="dni" name="dni" required placeholder="Ej: 45123456">
        </div>
        <div class="form-grupo">
            <label for="tel">Número de teléfono:</label>
            <input type="tel" id="tel" name="tel" required placeholder="Sin 0 ni 15" maxlength="10">
        </div>
        <div class="form-grupo">
            <label for="email">Correo Electrónico de Contacto:</label>
            <input type="email" id="email" name="email" required placeholder="correo@ejemplo.com">
        </div>

        <div class="form-grupo">
            <label for="anio">Año al que ingresa:</label>
            <select id="anio" name="anio" required>
                <option value="">Seleccione una opción</option>
                <option value="1er año">1er Año</option>
                <option value="4to año">4to Año</option>
            </select>
        </div>
        <div class="form-grupo">
            <label for="procedencia">Desde que institución venís:</label>
            <input type="text" id="procedencia" name="procedencia" required placeholder="Indicar escuela">
        </div>
        <div class="form-grupo" id="grupo-modalidad" style="display:none;">
             <label for="modalidad">Elegí modalidad:</label>
            <select id="modalidad" name="modalidad" required>
                <option value="">Seleccione una opción</option>
                <option value="Electromecánica">Técnico en electromecánica</option>
                <option value="Alimentos">Tecnicatura en tecnología de los alimentos</option>
            </select>
        </div>
        <button type="submit" class="btn-enviar">Enviar Preinscripción</button>
    </form>
    <div id="mensajeExito" style="display:none; margin-top: 20px; padding: 15px; background: #d4edda; color: #155724; border-radius: 4px;">
    ¡Preinscripción enviada con éxito! Los datos han sido registrados correctamente.
</div>
</section>
<div id="site-footer"></div>
      <script src="nav-footer.js"></script>
<script src="script.js"></script>
     <script src="inscripcion.js"></script>
</body>
</html>
